spring:
  application:
    name: gateway-service-test
  cloud:
    gateway:
      enabled: false  # 테스트에서는 Gateway 자동 설정 비활성화

# Resilience4j RateLimiter 테스트 설정
resilience4j:
  ratelimiter:
    configs:
      default:
        limitForPeriod: 10
        limitRefreshPeriod: 1s
        timeoutDuration: 0
    instances:
      ip-rate-limiter:
        baseConfig: default
        limitForPeriod: 10
      user-rate-limiter:
        baseConfig: default
        limitForPeriod: 50

# Security 설정 (테스트용)
security:
  enabled: false
  jwt:
    secret: test-secret-key-for-testing-32chars

logging:
  level:
    com.example.gateway: DEBUG
    io.github.resilience4j: DEBUG

